{% extends "layout.html" %}

{% block content %}
<div class="container mt-5" style="max-width: 650px;">
    <div class="card shadow-sm border-0">
        <div class="card-header bg-warning text-dark font-weight-bold d-flex justify-content-between align-items-center">
            <span>✏️ Editar Proveedor #{{ proveedor.id }}</span>
            <a href="{{ url_for('proveedores.ver_proveedores') }}" class="btn btn-sm btn-outline-dark">Volver</a>
        </div>
        <div class="card-body">
            <form method="POST">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="font-weight-bold">NIT / Documento</label>
                        <input type="text" name="nit" class="form-control" value="{{ proveedor.nit }}" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="font-weight-bold">Nombre de la Empresa</label>
                        <input type="text" name="nombre" class="form-control" value="{{ proveedor.nombre }}" required>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="font-weight-bold">Persona de Contacto</label>
                        <input type="text" name="contacto" class="form-control" value="{{ proveedor.contacto or '' }}">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="font-weight-bold">Teléfono</label>
                        <input type="text" name="telefono" class="form-control" value="{{ proveedor.telefono or '' }}">
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="font-weight-bold">Correo Electrónico</label>
                        <input type="email" name="email" class="form-control" value="{{ proveedor.email or '' }}">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="font-weight-bold">Dirección</label>
                        <input type="text" name="direccion" class="form-control" value="{{ proveedor.direccion or '' }}">
                    </div>
                </div>

                <div class="d-flex justify-content-end">
                    <a href="{{ url_for('proveedores.ver_proveedores') }}" class="btn btn-secondary mr-2">Cancelar</a>
                    <button type="submit" class="btn btn-warning font-weight-bold">💾 Guardar Cambios</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
