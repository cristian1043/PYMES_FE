{% extends "layout.html" %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">Registrar Nuevo Proveedor</h4>
                </div>
                <div class="card-body">
                    <form action="{{ url_for('proveedores.nuevo_proveedor') }}" method="POST">
                        <div class="row">
                            <div class="col-md-6 form-group mb-3">
                                <label for="nit">NIT / Identificación *</label>
                                <input type="text" class="form-control" id="nit" name="nit" required pattern="[0-9.\-]{5,20}" title="Formato válido de NIT o documento (ej: 900123456-7)" placeholder="900.123.456-7">
                            </div>
                            <div class="col-md-6 form-group mb-3">
                                <label for="nombre">Nombre de la Empresa *</label>
                                <input type="text" class="form-control" id="nombre" name="nombre" required minlength="3" placeholder="Distribuidora S.A.S.">
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 form-group mb-3">
                                <label for="telefono">Teléfono *</label>
                                <input type="tel" class="form-control" id="telefono" name="telefono" required pattern="[0-9+\s\-]{7,15}" title="Solo números, espacios o signo +" placeholder="+57 300 1234567">
                            </div>
                            <div class="col-md-6 form-group mb-3">
                                <label for="email">Correo Electrónico *</label>
                                <input type="email" class="form-control" id="email" name="email" required placeholder="contacto@empresa.com">
                            </div>
                        </div>

                        <div class="form-group mb-4">
                            <label for="direccion">Dirección *</label>
                            <input type="text" class="form-control" id="direccion" name="direccion" required minlength="5" placeholder="Calle 123 #45-67">
                        </div>

                        <div class="d-flex justify-content-between">
                            <a href="{{ url_for('proveedores.ver_proveedores') }}" class="btn btn-secondary">Cancelar</a>
                            <button type="submit" class="btn btn-success">Guardar Proveedor</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
