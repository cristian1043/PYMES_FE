{% extends "layout.html" %}

{% block content %}
<div class="container mt-5" style="max-width: 650px;">
    <div class="card shadow-sm border-0">
        <div class="card-header bg-warning text-dark font-weight-bold d-flex justify-content-between align-items-center">
            <span>✏️ Editar Cliente #{{ cliente.id }}</span>
            <a href="{{ url_for('reportes.reporte_clientes') if request.args.get('ref') == 'reporte' else url_for('clientes.ver_clientes') }}" class="btn btn-sm btn-outline-dark">Volver</a>
        </div>
        <div class="card-body">
            <form method="POST">
                <input type="hidden" name="ref" value="{{ request.args.get('ref', '') }}">
                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label class="font-weight-bold">Tipo Doc.</label>
                        <select name="tipo_documento" class="form-control">
                            <option value="CC" {% if cliente.tipo_documento == 'CC' %}selected{% endif %}>CC</option>
                            <option value="NIT" {% if cliente.tipo_documento == 'NIT' %}selected{% endif %}>NIT</option>
                            <option value="CE" {% if cliente.tipo_documento == 'CE' %}selected{% endif %}>CE</option>
                            <option value="PAS" {% if cliente.tipo_documento == 'PAS' %}selected{% endif %}>Pasaporte</option>
                        </select>
                    </div>
                    <div class="col-md-8 mb-3">
                        <label class="font-weight-bold">Número de Documento</label>
                        <input type="text" name="documento" class="form-control" value="{{ cliente.documento }}" required>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="font-weight-bold">Nombre</label>
                        <input type="text" name="nombre" class="form-control" value="{{ cliente.nombre }}" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="font-weight-bold">Apellido</label>
                        <input type="text" name="apellido" class="form-control" value="{{ cliente.apellido or '' }}">
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="font-weight-bold">Correo Electrónico</label>
                        <input type="email" name="email" class="form-control" value="{{ cliente.email or '' }}">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="font-weight-bold">Teléfono</label>
                        <input type="text" name="telefono" class="form-control" value="{{ cliente.telefono or '' }}">
                    </div>
                </div>

                <div class="form-group mb-4">
                    <label class="font-weight-bold">Dirección</label>
                    <input type="text" name="direccion" class="form-control" value="{{ cliente.direccion or '' }}">
                </div>

                <!-- SECCIÓN FINANCIERA / TARJETAS (PRIVADO ADMIN) -->
                {% if session.get('usuario', {}).get('rol_id') == 1 %}
                <div class="card bg-light border mb-4">
                    <div class="card-body">
                        <h6 class="text-primary font-weight-bold mb-3">💳 Métodos de Pago y Tarjetas Asociadas (Exclusivo Administrador)</h6>
                        <div class="form-group mb-3">
                            <label for="tiene_tarjeta" class="font-weight-bold">¿El cliente tiene Tarjetas / Métodos de Pago Asociados?</label>
                            <select class="form-control" id="tiene_tarjeta" name="tiene_tarjeta" onchange="toggleTarjetaFields()">
                                <option value="No" {% if cliente.tiene_tarjeta != 'Sí' %}selected{% endif %}>No (Sin tarjetas asociadas)</option>
                                <option value="Sí" {% if cliente.tiene_tarjeta == 'Sí' %}selected{% endif %}>Sí (Registrar información de tarjeta)</option>
                            </select>
                        </div>

                        <div id="div_tarjeta" style="display: {% if cliente.tiene_tarjeta == 'Sí' %}block{% else %}none{% endif %};">
                            <div class="row">
                                <div class="col-md-6 form-group mb-3">
                                    <label for="banco_tarjeta" class="font-weight-bold">Banco Emisor *</label>
                                    <select class="form-control" id="banco_tarjeta" name="banco_tarjeta">
                                        <option value="">-- Seleccionar Banco Emisor Autorizado --</option>
                                        {% set bancos = ['Bancolombia', 'Banco de Bogotá', 'Davivienda', 'BBVA Colombia', 'Banco de Occidente', 'Banco Popular', 'Banco AV Villas', 'Scotiabank Colpatria', 'Banco Agrario', 'Itaú Colombia', 'Banco Caja Social', 'Nequi', 'Daviplata', 'Nu Colombia', 'Lulo Bank', 'RappiPay', 'Otro Banco Autorizado'] %}
                                        {% for b in bancos %}
                                            <option value="{{ b }}" {% if cliente.banco_tarjeta == b %}selected{% endif %}>{{ b }}</option>
                                        {% endfor %}
                                    </select>
                                </div>
                                <div class="col-md-3 form-group mb-3">
                                    <label for="tipo_tarjeta" class="font-weight-bold">Tipo de Tarjeta</label>
                                    <select class="form-control" id="tipo_tarjeta" name="tipo_tarjeta">
                                        <option value="Crédito" {% if cliente.tipo_tarjeta == 'Crédito' %}selected{% endif %}>Tarjeta de Crédito</option>
                                        <option value="Débito" {% if cliente.tipo_tarjeta == 'Débito' %}selected{% endif %}>Tarjeta de Débito</option>
                                    </select>
                                </div>
                                <div class="col-md-3 form-group mb-3">
                                    <label for="franquicia_tarjeta" class="font-weight-bold">Franquicia</label>
                                    <select class="form-control" id="franquicia_tarjeta" name="franquicia_tarjeta">
                                        <option value="Visa" {% if cliente.franquicia_tarjeta == 'Visa' %}selected{% endif %}>Visa</option>
                                        <option value="Mastercard" {% if cliente.franquicia_tarjeta == 'Mastercard' %}selected{% endif %}>Mastercard</option>
                                        <option value="American Express" {% if cliente.franquicia_tarjeta == 'American Express' %}selected{% endif %}>American Express</option>
                                        <option value="Diners Club" {% if cliente.franquicia_tarjeta == 'Diners Club' %}selected{% endif %}>Diners Club</option>
                                        <option value="Otra" {% if cliente.franquicia_tarjeta == 'Otra' %}selected{% endif %}>Otra Franquicia</option>
                                    </select>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6 form-group mb-3">
                                    <label for="numero_tarjeta" class="font-weight-bold">Número de Tarjeta (16 dígitos)</label>
                                    <input type="text" class="form-control" id="numero_tarjeta" name="numero_tarjeta" value="{{ cliente.numero_tarjeta or '' }}" maxlength="19" pattern="[0-9\s]{13,19}" placeholder="1234 5678 9012 3456" oninput="actualizarUltimosDigitos(this)">
                                </div>
                                <div class="col-md-6 form-group mb-3">
                                    <label for="titular_tarjeta" class="font-weight-bold">Nombre del Titular de la Tarjeta</label>
                                    <input type="text" class="form-control" id="titular_tarjeta" name="titular_tarjeta" value="{{ cliente.titular_tarjeta or '' }}" placeholder="JUAN PEREZ">
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-4 form-group mb-3">
                                    <label for="fecha_expiracion" class="font-weight-bold">Fecha Expiración (MM/AA)</label>
                                    <input type="text" class="form-control" id="fecha_expiracion" name="fecha_expiracion" value="{{ cliente.fecha_expiracion or '' }}" maxlength="5" pattern="(0[1-9]|1[0-2])\/[0-9]{2}" placeholder="12/28">
                                </div>
                                <div class="col-md-4 form-group mb-3">
                                    <label for="cvc_tarjeta" class="font-weight-bold">CVC / Código de Seguridad</label>
                                    <input type="text" class="form-control" id="cvc_tarjeta" name="cvc_tarjeta" value="{{ cliente.cvc_tarjeta or '' }}" maxlength="4" pattern="[0-9]{3,4}" placeholder="123">
                                </div>
                                <div class="col-md-4 form-group mb-3">
                                    <label for="ultimos_digitos_tarjeta" class="font-weight-bold">Últimos 4 Dígitos</label>
                                    <input type="text" class="form-control bg-light" id="ultimos_digitos_tarjeta" name="ultimos_digitos_tarjeta" value="{{ cliente.ultimos_digitos_tarjeta or '' }}" maxlength="4" readonly placeholder="3456">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <script>
                    function toggleTarjetaFields() {
                        var val = document.getElementById('tiene_tarjeta').value;
                        var div = document.getElementById('div_tarjeta');
                        div.style.display = (val === 'Sí') ? 'block' : 'none';
                    }

                    function actualizarUltimosDigitos(input) {
                        var num = input.value.replace(/\D/g, '');
                        if (num.length >= 4) {
                            document.getElementById('ultimos_digitos_tarjeta').value = num.slice(-4);
                        }
                    }
                </script>
                {% endif %}

                <div class="d-flex justify-content-end">
                    <a href="{{ url_for('reportes.reporte_clientes') if request.args.get('ref') == 'reporte' else url_for('clientes.ver_clientes') }}" class="btn btn-secondary mr-2">Cancelar</a>
                    <button type="submit" class="btn btn-warning font-weight-bold">💾 Guardar Cambios</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
