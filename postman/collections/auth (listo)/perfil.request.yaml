$kind: http-request
name: perfil (me)
url: '{{base_url}}/auth/me'
method: GET
headers:
  - key: Authorization
    value: 'Bearer {{token}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 200 OK", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Response is JSON", function () {
          pm.response.to.be.json;
      });

      pm.test("Response contains user identity fields", function () {
          const json = pm.response.json();
          pm.expect(json).to.satisfy(function(j) {
              return j.hasOwnProperty("email") || j.hasOwnProperty("username") || j.hasOwnProperty("id");
          });
      });

      pm.test("Response time is under 2000ms", function () {
          pm.expect(pm.response.responseTime).to.be.below(2000);
      });
order: 1000000000003000
