{% extends "layout.html" %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">Registrar Nuevo Producto</h4>
                </div>
                <div class="card-body">
                    <form action="{{ url_for('productos.nuevo_producto') }}" method="POST">
                        <div class="form-group mb-3">
                            <label for="nombre">Nombre del Producto *</label>
                            <input type="text" class="form-control" id="nombre" name="nombre" required minlength="3" maxlength="100" placeholder="Ej: Laptop HP 15">
                        </div>

                        <div class="form-group mb-3">
                            <label for="descripcion">Descripción</label>
                            <textarea class="form-control" id="descripcion" name="descripcion" rows="3" placeholder="Detalles del producto..."></textarea>
                        </div>

                        <div class="row">
                            <div class="col-md-6 form-group mb-3">
                                <label for="precio">Precio ($) *</label>
                                <input type="number" step="0.01" min="0.01" class="form-control" id="precio" name="precio" required placeholder="0.01">
                            </div>
                            <div class="col-md-6 form-group mb-3">
                                <label for="stock">Cantidad en Stock *</label>
                                <input type="number" min="0" class="form-control" id="stock" name="stock" required placeholder="10">
                            </div>
                        </div>

                        <div class="form-group mb-4">
                            <label for="id_categoria">Categoría</label>
                            <select class="form-control" id="id_categoria" name="id_categoria">
                                <option value="">-- Seleccionar Categoría --</option>
                                {% for cat in categorias %}
                                    <option value="{{ cat.id }}">{{ cat.nombre }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="d-flex justify-content-between">
                            <a href="{{ url_for('productos.ver_productos') }}" class="btn btn-secondary">Cancelar</a>
                            <button type="submit" class="btn btn-success">Guardar Producto</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
