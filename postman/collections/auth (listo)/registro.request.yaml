$kind: http-request
name: registro
url: {{base_url}}/auth/register
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: "{\r\n    \"tipo_documento\": \"CC\",\r\n    \"documento\": \"1001234567\",\r\n    \"nombre\": \"Admin\",\r\n    \"apellido\": \"Sistema\",\r\n    \"email\": \"admin@pymesoft.com\",\r\n    \"telefono\": \"3001234567\",\r\n    \"username\": \"admin\",\r\n    \"password_hash\": \"123456\",\r\n    \"id_rol\": 1\r\n}"
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 201 Created or 200 OK", function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 201]);
      });

      pm.test("Response is JSON", function () {
          pm.response.to.be.json;
      });

      pm.test("Response contains usuario or id field", function () {
          const json = pm.response.json();
          pm.expect(json).to.satisfy(function(j) {
              return j.hasOwnProperty("usuario") || j.hasOwnProperty("id") || j.hasOwnProperty("exito");
          });
      });
