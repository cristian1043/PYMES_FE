{% extends "layout.html" %}

{% block content %}
<div class="container mt-5" style="max-width: 650px;">
    <div class="card shadow-sm border-0">
        <div class="card-header bg-warning text-dark font-weight-bold d-flex justify-content-between align-items-center">
            <span>✏️ Editar Cliente #{{ cliente.id }}</span>
            <a href="{{ url_for('clientes.ver_clientes') }}" class="btn btn-sm btn-outline-dark">Volver</a>
        </div>
        <div class="card-body">
            <form method="POST">
                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label class="font-weight-bold">Tipo Doc.</label>
                        <select name="tipo_documento" class="form-control">
                            <option value="CC" {% if cliente.tipo_documento == 'CC' %}selected{% endif %}>CC</option>
                            <option value="NIT" {% if cliente.tipo_documento == 'NIT' %}selected{% endif %}>NIT</option>
                            <option value="CE" {% if cliente.tipo_documento == 'CE' %}selected{% endif %}>CE</option>
                            <option value="PAS" {% if cliente.tipo_documento == 'PAS' %}selected{% endif %}>Pasaporte</option>
                        </select>
                    </div>
                    <div class="col-md-8 mb-3">
                        <label class="font-weight-bold">Número de Documento</label>
                        <input type="text" name="documento" class="form-control" value="{{ cliente.documento }}" required>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="font-weight-bold">Nombre</label>
                        <input type="text" name="nombre" class="form-control" value="{{ cliente.nombre }}" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="font-weight-bold">Apellido</label>
                        <input type="text" name="apellido" class="form-control" value="{{ cliente.apellido or '' }}">
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="font-weight-bold">Correo Electrónico</label>
                        <input type="email" name="email" class="form-control" value="{{ cliente.email or '' }}">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="font-weight-bold">Teléfono</label>
                        <input type="text" name="telefono" class="form-control" value="{{ cliente.telefono or '' }}">
                    </div>
                </div>

                <div class="form-group mb-4">
                    <label class="font-weight-bold">Dirección</label>
                    <input type="text" name="direccion" class="form-control" value="{{ cliente.direccion or '' }}">
                </div>

                <div class="d-flex justify-content-end">
                    <a href="{{ url_for('clientes.ver_clientes') }}" class="btn btn-secondary mr-2">Cancelar</a>
                    <button type="submit" class="btn btn-warning font-weight-bold">💾 Guardar Cambios</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
