{% extends "layout.html" %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">Registrar Nuevo Cliente</h4>
                </div>
                <div class="card-body">
                    <form action="{{ url_for('clientes.nuevo_cliente') }}" method="POST">
                        <div class="row">
                            <div class="col-md-6 form-group mb-3">
                                <label for="nombre">Nombre *</label>
                                <input type="text" class="form-control" id="nombre" name="nombre" required minlength="2" maxlength="50" placeholder="Juan">
                            </div>
                            <div class="col-md-6 form-group mb-3">
                                <label for="apellido">Apellido *</label>
                                <input type="text" class="form-control" id="apellido" name="apellido" required minlength="2" maxlength="50" placeholder="Pérez">
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 form-group mb-3">
                                <label for="email">Correo Electrónico *</label>
                                <input type="email" class="form-control" id="email" name="email" required placeholder="juan.perez@email.com">
                            </div>
                            <div class="col-md-6 form-group mb-3">
                                <label for="telefono">Teléfono *</label>
                                <input type="tel" class="form-control" id="telefono" name="telefono" required pattern="[0-9+\s\-]{7,15}" title="Solo números, espacios o signo + (mínimo 7 dígitos)" placeholder="+57 300 1234567">
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 form-group mb-3">
                                <label for="documento">Cédula / Documento ID *</label>
                                <input type="text" class="form-control" id="documento" name="documento" required pattern="[0-9A-Za-z\-]{5,20}" title="Entre 5 y 20 caracteres alfanuméricos" placeholder="1098765432">
                            </div>
                            <div class="col-md-6 form-group mb-3">
                                <label for="direccion">Dirección</label>
                                <input type="text" class="form-control" id="direccion" name="direccion" placeholder="Carrera 10 #20-30">
                            </div>
                        </div>

                        <!-- SECCIÓN FINANCIERA / TARJETAS (PRIVADO ADMIN) -->
                        {% if session.get('usuario', {}).get('rol_id') == 1 %}
                        <div class="card bg-light border mb-4">
                            <div class="card-body">
                                <h6 class="text-primary font-weight-bold mb-3">💳 Métodos de Pago y Tarjetas Asociadas (Exclusivo Administrador)</h6>
                                <div class="form-group mb-3">
                                    <label for="tiene_tarjeta" class="font-weight-bold">¿El cliente tiene Tarjetas / Métodos de Pago Asociados?</label>
                                    <select class="form-control" id="tiene_tarjeta" name="tiene_tarjeta" onchange="toggleTarjetaFields()">
                                        <option value="No" selected>No (Sin tarjetas asociadas)</option>
                                        <option value="Sí">Sí (Registrar información de tarjeta)</option>
                                    </select>
                                </div>

                                <div id="div_tarjeta" style="display: none;">
                                    <div class="row">
                                        <div class="col-md-6 form-group mb-3">
                                            <label for="banco_tarjeta" class="font-weight-bold">Banco Emisor *</label>
                                            <select class="form-control" id="banco_tarjeta" name="banco_tarjeta">
                                                <option value="">-- Seleccionar Banco Emisor Autorizado --</option>
                                                <option value="Bancolombia">Bancolombia</option>
                                                <option value="Banco de Bogotá">Banco de Bogotá</option>
                                                <option value="Davivienda">Davivienda</option>
                                                <option value="BBVA Colombia">BBVA Colombia</option>
                                                <option value="Banco de Occidente">Banco de Occidente</option>
                                                <option value="Banco Popular">Banco Popular</option>
                                                <option value="Banco AV Villas">Banco AV Villas</option>
                                                <option value="Scotiabank Colpatria">Scotiabank Colpatria</option>
                                                <option value="Banco Agrario">Banco Agrario de Colombia</option>
                                                <option value="Itaú Colombia">Itaú Colombia</option>
                                                <option value="Banco Caja Social">Banco Caja Social</option>
                                                <option value="Nequi">Nequi (Bancolombia)</option>
                                                <option value="Daviplata">Daviplata (Davivienda)</option>
                                                <option value="Nu Colombia">Nu Colombia (Nubank)</option>
                                                <option value="Lulo Bank">Lulo Bank</option>
                                                <option value="RappiPay">RappiPay</option>
                                                <option value="Otro Banco Autorizado">Otro Banco Autorizado</option>
                                            </select>
                                        </div>
                                        <div class="col-md-3 form-group mb-3">
                                            <label for="tipo_tarjeta" class="font-weight-bold">Tipo de Tarjeta</label>
                                            <select class="form-control" id="tipo_tarjeta" name="tipo_tarjeta">
                                                <option value="Crédito">Tarjeta de Crédito</option>
                                                <option value="Débito">Tarjeta de Débito</option>
                                            </select>
                                        </div>
                                        <div class="col-md-3 form-group mb-3">
                                            <label for="franquicia_tarjeta" class="font-weight-bold">Franquicia</label>
                                            <select class="form-control" id="franquicia_tarjeta" name="franquicia_tarjeta">
                                                <option value="Visa">Visa</option>
                                                <option value="Mastercard">Mastercard</option>
                                                <option value="American Express">American Express</option>
                                                <option value="Diners Club">Diners Club</option>
                                                <option value="Otra">Otra Franquicia</option>
                                            </select>
                                        </div>
                                    </div>

                                    <div class="row">
                                        <div class="col-md-6 form-group mb-3">
                                            <label for="numero_tarjeta" class="font-weight-bold">Número de Tarjeta (16 dígitos)</label>
                                            <input type="text" class="form-control" id="numero_tarjeta" name="numero_tarjeta" maxlength="19" pattern="[0-9\s]{13,19}" placeholder="1234 5678 9012 3456" oninput="actualizarUltimosDigitos(this)">
                                        </div>
                                        <div class="col-md-6 form-group mb-3">
                                            <label for="titular_tarjeta" class="font-weight-bold">Nombre del Titular de la Tarjeta</label>
                                            <input type="text" class="form-control" id="titular_tarjeta" name="titular_tarjeta" placeholder="JUAN PEREZ">
                                        </div>
                                    </div>

                                    <div class="row">
                                        <div class="col-md-4 form-group mb-3">
                                            <label for="fecha_expiracion" class="font-weight-bold">Fecha Expiración (MM/AA)</label>
                                            <input type="text" class="form-control" id="fecha_expiracion" name="fecha_expiracion" maxlength="5" pattern="(0[1-9]|1[0-2])\/[0-9]{2}" placeholder="12/28">
                                        </div>
                                        <div class="col-md-4 form-group mb-3">
                                            <label for="cvc_tarjeta" class="font-weight-bold">CVC / Código de Seguridad</label>
                                            <input type="text" class="form-control" id="cvc_tarjeta" name="cvc_tarjeta" maxlength="4" pattern="[0-9]{3,4}" placeholder="123">
                                        </div>
                                        <div class="col-md-4 form-group mb-3">
                                            <label for="ultimos_digitos_tarjeta" class="font-weight-bold">Últimos 4 Dígitos</label>
                                            <input type="text" class="form-control bg-light" id="ultimos_digitos_tarjeta" name="ultimos_digitos_tarjeta" maxlength="4" readonly placeholder="3456">
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <script>
                            function toggleTarjetaFields() {
                                var val = document.getElementById('tiene_tarjeta').value;
                                var div = document.getElementById('div_tarjeta');
                                div.style.display = (val === 'Sí') ? 'block' : 'none';
                            }

                            function actualizarUltimosDigitos(input) {
                                var num = input.value.replace(/\D/g, '');
                                if (num.length >= 4) {
                                    document.getElementById('ultimos_digitos_tarjeta').value = num.slice(-4);
                                }
                            }
                        </script>
                        {% endif %}

                        <div class="d-flex justify-content-between">
                            <a href="{{ url_for('clientes.ver_clientes') }}" class="btn btn-secondary">Cancelar</a>
                            <button type="submit" class="btn btn-success">Guardar Cliente</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
