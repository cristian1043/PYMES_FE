{% extends "layout.html" %}

{% block content %}
<div class="container mt-5" style="max-width: 650px;">
    <div class="card shadow-sm border-0">
        <div class="card-header bg-warning text-dark font-weight-bold d-flex justify-content-between align-items-center">
            <span>✏️ Editar Producto #{{ producto.id }}</span>
            <a href="{{ url_for('productos.ver_productos') }}" class="btn btn-sm btn-outline-dark">Volver</a>
        </div>
        <div class="card-body">
            <form method="POST">
                <div class="row">
                    <div class="col-md-4 form-group mb-3">
                        <label class="font-weight-bold">Código de Producto</label>
                        <input type="text" name="codigo" class="form-control bg-light font-weight-bold" value="{{ producto.codigo or ('PROD-' ~ '%03d'|format(producto.id)) }}" readonly>
                    </div>
                    <div class="col-md-8 form-group mb-3">
                        <label class="font-weight-bold">Nombre del Producto</label>
                        <input type="text" name="nombre" class="form-control" value="{{ producto.nombre }}" required>
                    </div>
                </div>

                <div class="form-group mb-3">
                    <label class="font-weight-bold">Descripción</label>
                    <textarea name="descripcion" class="form-control" rows="3">{{ producto.descripcion or '' }}</textarea>
                </div>

                <div class="row">
                    {% if session.get('usuario', {}).get('rol_id') == 1 %}
                    <div class="col-md-4 mb-3">
                        <label class="font-weight-bold">Costo Mayor ($) [Admin]</label>
                        <input type="number" step="0.01" name="costo" class="form-control" value="{{ producto.costo or (producto.precio * 0.70) }}">
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="font-weight-bold">Precio Venta ($)</label>
                        <input type="number" step="0.01" name="precio" class="form-control" value="{{ producto.precio }}" required>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="font-weight-bold">Stock en Inventario</label>
                        <input type="number" name="stock" class="form-control" value="{{ producto.stock }}" required>
                    </div>
                    {% else %}
                    <div class="col-md-6 mb-3">
                        <label class="font-weight-bold">Precio Venta ($)</label>
                        <input type="number" step="0.01" name="precio" class="form-control" value="{{ producto.precio }}" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="font-weight-bold">Stock en Inventario</label>
                        <input type="number" name="stock" class="form-control" value="{{ producto.stock }}" required>
                    </div>
                    {% endif %}
                </div>

                <div class="row">
                    <div class="col-md-6 form-group mb-4">
                        <label class="font-weight-bold">Categoría</label>
                        <select name="id_categoria" class="form-control">
                            <option value="">-- Sin Categoría --</option>
                            {% for cat in categorias %}
                                <option value="{{ cat.id }}" {% if cat.id == producto.id_categoria %}selected{% endif %}>
                                    {{ cat.nombre }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="col-md-6 form-group mb-4">
                        <label class="font-weight-bold">Proveedor Distribuidor *</label>
                        <select name="id_proveedor" class="form-control" required>
                            <option value="">-- Seleccionar Proveedor Distribuidor --</option>
                            {% for prov in proveedores %}
                                <option value="{{ prov.id }}" {% if prov.id == producto.id_proveedor %}selected{% endif %}>
                                    {{ prov.nombre }} (NIT: {{ prov.nit }})
                                </option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <hr class="my-3">
                <h6 class="font-weight-bold text-primary mb-3">🌐 Publicación en el Portal de Clientes</h6>
                <div class="row mb-3">
                    <div class="col-md-4">
                        <div class="custom-control custom-checkbox">
                            <input type="checkbox" class="custom-control-input" id="publicado_portal" name="publicado_portal" {% if producto.publicado_portal %}checked{% endif %}>
                            <label class="custom-control-label font-weight-bold" for="publicado_portal">Publicar en Portal</label>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="custom-control custom-checkbox">
                            <input type="checkbox" class="custom-control-input" id="disponible_portal" name="disponible_portal" {% if producto.get('disponible_portal', True) %}checked{% endif %}>
                            <label class="custom-control-label" for="disponible_portal">Disponible</label>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="custom-control custom-checkbox">
                            <input type="checkbox" class="custom-control-input" id="destacado" name="destacado" {% if producto.destacado %}checked{% endif %}>
                            <label class="custom-control-label text-warning font-weight-bold" for="destacado">⭐ Destacado</label>
                        </div>
                    </div>
                </div>
                <div class="row mb-3">
                    <div class="col-md-4 form-group">
                        <label>Precio Público ($)</label>
                        <input type="number" step="0.01" min="0" class="form-control" name="precio_publico" value="{{ producto.precio_publico or '' }}" placeholder="Usa Precio Venta">
                    </div>
                    <div class="col-md-8 form-group">
                        <label>URL Imagen Pública</label>
                        <input type="url" class="form-control" name="imagen_publica" value="{{ producto.imagen_publica or '' }}" placeholder="https://...">
                    </div>
                </div>
                <div class="form-group mb-4">
                    <label>Descripción Comercial Pública</label>
                    <textarea name="descripcion_publica" class="form-control" rows="2">{{ producto.descripcion_publica or '' }}</textarea>
                </div>

                <div class="d-flex justify-content-end">
                    <a href="{{ url_for('productos.ver_productos') }}" class="btn btn-secondary mr-2">Cancelar</a>
                    <button type="submit" class="btn btn-warning font-weight-bold">💾 Guardar Cambios</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
