{% extends "layout.html" %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow">
                <div class="card-header bg-success text-white">
                    <h4 class="mb-0">Emitir Nueva Factura de Venta</h4>
                </div>
                <div class="card-body">
                    <form action="{{ url_for('facturas.nueva_factura') }}" method="POST">
                        <div class="row">
                            <div class="col-md-6 form-group mb-3">
                                <label for="numero">Número de Factura *</label>
                                <input type="text" class="form-control" id="numero" name="numero" required minlength="3" placeholder="FAC-001">
                            </div>
                            <div class="col-md-6 form-group mb-3">
                                <label for="id_cliente">Cliente *</label>
                                <select class="form-control" id="id_cliente" name="id_cliente" required>
                                    <option value="">-- Seleccionar Cliente --</option>
                                    {% for cli in clientes %}
                                        <option value="{{ cli.id }}">{{ cli.tipo_documento }} {{ cli.documento }} - {{ cli.nombre }} {{ cli.apellido }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                        </div>

                        <div class="form-group mb-3">
                            <label for="id_metodo_pago">Método de Pago *</label>
                            <select class="form-control" id="id_metodo_pago" name="id_metodo_pago" required>
                                <option value="">-- Seleccionar Método de Pago --</option>
                                {% for m in metodos_pago %}
                                    <option value="{{ m.id }}">{{ m.nombre }}</option>
                                {% else %}
                                    <option value="1">Efectivo</option>
                                    <option value="2">Tarjeta de Crédito / Débito</option>
                                    <option value="3">Transferencia Bancaria</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="row">
                            <div class="col-md-4 form-group mb-3">
                                <label for="subtotal">Subtotal ($) *</label>
                                <input type="number" step="0.01" min="0.01" class="form-control" id="subtotal" name="subtotal" required placeholder="0.00">
                            </div>
                            <div class="col-md-4 form-group mb-3">
                                <label for="iva">IVA ($)</label>
                                <input type="number" step="0.01" min="0" class="form-control" id="iva" name="iva" value="0.00">
                            </div>
                            <div class="col-md-4 form-group mb-3">
                                <label for="descuento">Descuento ($)</label>
                                <input type="number" step="0.01" min="0" class="form-control" id="descuento" name="descuento" value="0.00">
                            </div>
                        </div>

                        <div class="d-flex justify-content-between">
                            <a href="{{ url_for('facturas.ver_facturas') }}" class="btn btn-secondary">Cancelar</a>
                            <button type="submit" class="btn btn-success">Generar Factura</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
